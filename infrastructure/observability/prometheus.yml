global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "ekoa-api"
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  - job_name: "ekoa-ai"
    static_configs:
      - targets: ["ai:8001"]
        labels:
          service: ai

  - job_name: "ekoa-worker"
    static_configs:
      - targets: ["worker:9100"]
        labels:
          service: worker
