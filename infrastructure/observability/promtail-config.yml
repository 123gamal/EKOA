server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Every EKOA service already emits structured JSON to stdout (see
  # ekoa_config.logging.JsonFormatter) — Docker service discovery finds
  # every container on this compose project, and the pipeline below parses
  # that JSON so `service`/`level`/`correlation_id` become queryable Loki
  # labels instead of opaque log text.
  - job_name: ekoa-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.project=docker"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: compose_service
    pipeline_stages:
      - json:
          expressions:
            service: service
            level: level
            correlation_id: correlation_id
      - labels:
          service:
          level:
          correlation_id:
