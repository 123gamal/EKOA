# =============================================================================
# EKOA – Enterprise Knowledge Operations Assistant
# Docker Compose – Local Development Services
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 – Primary relational datastore
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: ekoa-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ekoa_db}
      POSTGRES_USER: ${POSTGRES_USER:-ekoa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ekoa_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ekoa_user} -d ${POSTGRES_DB:-ekoa_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    networks:
      - ekoa-network

  # ---------------------------------------------------------------------------
  # Qdrant – Vector similarity search engine
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ekoa-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_REST_PORT:-6333}:6333"   # REST API
      - "${QDRANT_GRPC_PORT:-6334}:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && echo -e \"GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n\" >&3 && timeout 2 cat <&3' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    networks:
      - ekoa-network

  # ---------------------------------------------------------------------------
  # Redis 7 Alpine – Caching, rate limiting & message broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ekoa-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "0.5"
    networks:
      - ekoa-network

  # ---------------------------------------------------------------------------
  # MailHog – dev-only SMTP catcher for org invite emails (Phase 13)
  # ---------------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: ekoa-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_WEB_PORT:-8025}:8025"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
    networks:
      - ekoa-network

  # ---------------------------------------------------------------------------
  # API – FastAPI REST backend
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/python.Dockerfile
      target: api
    container_name: ekoa-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-ekoa_user}:${POSTGRES_PASSWORD:-ekoa_secret}@postgres:5432/${POSTGRES_DB:-ekoa_db}"
      REDIS_URL: "redis://redis:6379/0"
      RATE_LIMIT_BACKEND: "redis"
      QDRANT_HOST: qdrant
      CORS_ORIGINS: '["http://localhost:3000"]'
      DEBUG: "true"
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      FRONTEND_URL: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - ekoa-network

  # ---------------------------------------------------------------------------
  # AI – LangGraph agent orchestration service
  # ---------------------------------------------------------------------------
  ai:
    build:
      context: ../..
      dockerfile: infrastructure/docker/python.Dockerfile
      target: ai
    container_name: ekoa-ai
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-ekoa_user}:${POSTGRES_PASSWORD:-ekoa_secret}@postgres:5432/${POSTGRES_DB:-ekoa_db}"
      REDIS_URL: "redis://redis:6379/0"
      RATE_LIMIT_BACKEND: "redis"
      QDRANT_HOST: qdrant
      CORS_ORIGINS: '["http://localhost:3000"]'
      DEBUG: "true"
      # Phase 12: retriever_node now runs concurrently across requests via
      # asyncio.to_thread; disable the tokenizers library's own internal
      # thread pool to avoid the known concurrent-encode() deadlock.
      TOKENIZERS_PARALLELISM: "false"
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          # Phase 12: raised from 1.0. With the event-loop-blocking fix in
          # apps/ai/graph.py (retriever_node/synthesize_node now offload to a
          # thread pool), concurrent requests actually contend for real CPU
          # during the SentenceTransformer embedding step — give that
          # headroom instead of time-slicing a single core.
          memory: 1g
          cpus: "2.0"
    networks:
      - ekoa-network

  # ---------------------------------------------------------------------------
  # Worker – Celery background task processor
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/python.Dockerfile
      target: worker
    container_name: ekoa-worker
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ekoa_user}:${POSTGRES_PASSWORD:-ekoa_secret}@postgres:5432/${POSTGRES_DB:-ekoa_db}"
      REDIS_URL: "redis://redis:6379/0"
      QDRANT_HOST: qdrant
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "apps.worker.main", "inspect", "ping", "--timeout=3"]
      interval: 15s
      timeout: 30s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${WORKER_METRICS_PORT:-9100}:9100"
    networks:
      - ekoa-network

  # ---------------------------------------------------------------------------
  # MCP – Model Context Protocol server (Streamable HTTP)
  # ---------------------------------------------------------------------------
  mcp:
    build:
      context: ../..
      dockerfile: infrastructure/docker/python.Dockerfile
      target: mcp
    container_name: ekoa-mcp
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8002}:8002"
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-ekoa_user}:${POSTGRES_PASSWORD:-ekoa_secret}@postgres:5432/${POSTGRES_DB:-ekoa_db}"
      QDRANT_HOST: qdrant
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8002"
      MCP_ISSUER_URL: "http://mcp:8002/"
      MCP_RESOURCE_SERVER_URL: "http://mcp:8002/mcp"
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    networks:
      - ekoa-network

  # ---------------------------------------------------------------------------
  # Nginx – API Gateway / Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: ../nginx
    container_name: ekoa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
      - ai
      - web
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
    networks:
      - ekoa-network

  # ---------------------------------------------------------------------------
  # Web – Next.js frontend (multi-stage build)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        API_URL: "http://api:8000"
        AI_URL: "http://ai:8001"
        # NEXT_PUBLIC_* vars are inlined into the client bundle at build
        # time (see web.Dockerfile's comment) — setting them under
        # `environment:` below has NO effect on what the browser actually
        # requests, so they must be passed here instead.
        NEXT_PUBLIC_API_URL: "http://localhost/api/v1"
        NEXT_PUBLIC_WS_URL: "ws://localhost/ws"
    container_name: ekoa-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    # middleware.ts verifies the access-token JWT signature server-side
    # (Edge runtime) before treating a request as authenticated, so it needs
    # the same JWT_SECRET_KEY as api/ai/worker — without this every request
    # to a protected route silently redirects back to /login regardless of
    # whether the token is actually valid.
    env_file:
      - ../../.env
    environment:
      API_URL: "http://api:8000"
      AI_URL: "http://ai:8001"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    networks:
      - ekoa-network

  # ---------------------------------------------------------------------------
  # Observability: Prometheus (metrics) + Grafana (dashboards) + Loki/Promtail
  # (logs) + Tempo (traces) — Phase 16 Part F. Purely additive: none of the
  # app services depend on these, so their absence never breaks the app.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ekoa-prometheus
    restart: unless-stopped
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - ekoa-network

  grafana:
    image: grafana/grafana:11.3.1
    container_name: ekoa-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - ekoa-network

  loki:
    image: grafana/loki:3.2.1
    container_name: ekoa-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ../observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - ekoa-network

  promtail:
    image: grafana/promtail:3.2.1
    container_name: ekoa-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ../observability/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - ekoa-network

  tempo:
    image: grafana/tempo:2.6.1
    container_name: ekoa-tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo-config.yml
    volumes:
      - ../observability/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "${TEMPO_OTLP_GRPC_PORT:-4317}:4317"
      - "${TEMPO_OTLP_HTTP_PORT:-4318}:4318"
      - "${TEMPO_QUERY_PORT:-3200}:3200"
    networks:
      - ekoa-network

# =============================================================================
# Named Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  tempo_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  ekoa-network:
    driver: bridge
    name: ekoa-network
