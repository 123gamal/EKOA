# =============================================================================
# EKOA – Enterprise Knowledge Operations Assistant
# Docker Compose – Local Development Services
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 – Primary relational datastore
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: ekoa-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ekoa_db}
      POSTGRES_USER: ${POSTGRES_USER:-ekoa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ekoa_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ekoa_user} -d ${POSTGRES_DB:-ekoa_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    networks:
      - ekoa-network

  # ---------------------------------------------------------------------------
  # Qdrant – Vector similarity search engine
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ekoa-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_REST_PORT:-6333}:6333"   # REST API
      - "${QDRANT_GRPC_PORT:-6334}:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && echo -e \"GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n\" >&3 && timeout 2 cat <&3' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    networks:
      - ekoa-network

  # ---------------------------------------------------------------------------
  # Redis 7 Alpine – Caching, rate limiting & message broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ekoa-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "0.5"
    networks:
      - ekoa-network

  # ---------------------------------------------------------------------------
  # API – FastAPI REST backend
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/python.Dockerfile
      target: api
    container_name: ekoa-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-ekoa_user}:${POSTGRES_PASSWORD:-ekoa_secret}@postgres:5432/${POSTGRES_DB:-ekoa_db}"
      REDIS_URL: "redis://redis:6379/0"
      RATE_LIMIT_BACKEND: "redis"
      QDRANT_HOST: qdrant
      CORS_ORIGINS: '["http://localhost:3000"]'
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - ekoa-network

  # ---------------------------------------------------------------------------
  # AI – LangGraph agent orchestration service
  # ---------------------------------------------------------------------------
  ai:
    build:
      context: ../..
      dockerfile: infrastructure/docker/python.Dockerfile
      target: ai
    container_name: ekoa-ai
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-ekoa_user}:${POSTGRES_PASSWORD:-ekoa_secret}@postgres:5432/${POSTGRES_DB:-ekoa_db}"
      REDIS_URL: "redis://redis:6379/0"
      RATE_LIMIT_BACKEND: "redis"
      QDRANT_HOST: qdrant
      CORS_ORIGINS: '["http://localhost:3000"]'
      DEBUG: "true"
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    networks:
      - ekoa-network

  # ---------------------------------------------------------------------------
  # Worker – Celery background task processor
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/python.Dockerfile
      target: worker
    container_name: ekoa-worker
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ekoa_user}:${POSTGRES_PASSWORD:-ekoa_secret}@postgres:5432/${POSTGRES_DB:-ekoa_db}"
      REDIS_URL: "redis://redis:6379/0"
      QDRANT_HOST: qdrant
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "apps.worker.main", "inspect", "ping", "--timeout=3"]
      interval: 15s
      timeout: 30s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - ekoa-network

  # ---------------------------------------------------------------------------
  # MCP – Model Context Protocol server (Streamable HTTP)
  # ---------------------------------------------------------------------------
  mcp:
    build:
      context: ../..
      dockerfile: infrastructure/docker/python.Dockerfile
      target: mcp
    container_name: ekoa-mcp
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8002}:8002"
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-ekoa_user}:${POSTGRES_PASSWORD:-ekoa_secret}@postgres:5432/${POSTGRES_DB:-ekoa_db}"
      QDRANT_HOST: qdrant
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8002"
      MCP_ISSUER_URL: "http://mcp:8002/"
      MCP_RESOURCE_SERVER_URL: "http://mcp:8002/mcp"
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    networks:
      - ekoa-network

  # ---------------------------------------------------------------------------
  # Nginx – API Gateway / Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: ../nginx
    container_name: ekoa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
      - ai
      - web
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
    networks:
      - ekoa-network

  # ---------------------------------------------------------------------------
  # Web – Next.js frontend (multi-stage build)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        API_URL: "http://api:8000"
        AI_URL: "http://ai:8001"
    container_name: ekoa-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost/api/v1"
      NEXT_PUBLIC_WS_URL: "ws://localhost/ws"
      API_URL: "http://api:8000"
      AI_URL: "http://ai:8001"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    networks:
      - ekoa-network

# =============================================================================
# Named Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  ekoa-network:
    driver: bridge
    name: ekoa-network
