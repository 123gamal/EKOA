[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ekoa-shared-types"
version = "0.1.0"
description = "Shared Pydantic models for the EKOA platform"
# readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ekoa_types"]
