[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ekoa-shared-config"
version = "0.1.0"
description = "Centralized settings management for the EKOA platform"
# readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic-settings>=2.0",
    "cryptography>=41.0",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ekoa_config"]
