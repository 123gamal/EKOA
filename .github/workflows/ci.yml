# =============================================================================
# EKOA CI — lint, test, coverage reporting, and Docker image builds.
# Runs on every push and pull request. Does NOT deploy.
# Coverage is measured and reported (coverage.xml artifact) but not yet
# gated on a threshold — Phase 10 establishes the real baseline; a follow-up
# phase should add --cov-fail-under once that number is known.
# Security/dependency scanning (SAST/DAST/pip-audit) is still deferred.
# =============================================================================

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Test (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install shared packages (from source)
        run: |
          pip install --no-cache-dir packages/shared-config
          pip install --no-cache-dir packages/shared-types
          pip install --no-cache-dir packages/shared-utils

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Run test suite (SQLite, hermetic) with coverage
        run: |
          pytest tests/ -q --tb=short \
            --cov=apps --cov=packages \
            --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  test-postgres:
    name: Test (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ekoa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install shared packages (from source)
        run: |
          pip install --no-cache-dir packages/shared-config
          pip install --no-cache-dir packages/shared-types
          pip install --no-cache-dir packages/shared-utils

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Run Postgres integration suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ekoa_test
          EKOA_FERNET_KEY: Pn7QkC3vX9yW4mT8sL5jH2bG6rA1dE0fV9zK8nM3qX0=
        run: pytest tests/test_phase9_integration.py -q --tb=short

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run frontend tests
        run: npm test

      - name: Build
        run: npm run build

  docker-build:
    name: Docker image build (all services)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all images (api, ai, worker, mcp, nginx, web)
        run: >
          docker compose -f infrastructure/docker/docker-compose.yml
          build api ai worker mcp nginx web

  performance-smoke:
    name: Performance smoke test (manual trigger)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Bring up the full stack
        run: |
          cp .env.example .env 2>/dev/null || true
          docker compose -f infrastructure/docker/docker-compose.yml up -d --build

      - name: Wait for services to report healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              break
            fi
            echo "waiting for api..."; sleep 5
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Locust
        run: pip install --no-cache-dir locust

      - name: Run headless Locust smoke test
        run: |
          locust -f tests/performance/locustfile.py --host http://localhost:8000 \
            --headless -u 20 -r 5 -t 60s --csv=locust-smoke --only-summary

      - name: Upload Locust results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-smoke-results
          path: locust-smoke*

      - name: Tear down the stack
        if: always()
        run: docker compose -f infrastructure/docker/docker-compose.yml down -v
