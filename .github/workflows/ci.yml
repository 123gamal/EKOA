# =============================================================================
# EKOA CI — lint + test only (Phase 2 scope).
# Runs on every push and pull request. Does NOT deploy and does not push
# anywhere. This workflow only takes effect once the repository is pushed to
# GitHub (a manual step, handled separately).
# Coverage thresholds, security scanning, and deploy steps come in a later
# phase.
# =============================================================================

name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    name: Lint & Test (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install shared packages (from source)
        run: |
          pip install --no-cache-dir packages/shared-config
          pip install --no-cache-dir packages/shared-types
          pip install --no-cache-dir packages/shared-utils

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Run test suite (SQLite, hermetic)
        run: pytest tests/ -q --tb=short

  test-postgres:
    name: Test (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ekoa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install shared packages (from source)
        run: |
          pip install --no-cache-dir packages/shared-config
          pip install --no-cache-dir packages/shared-types
          pip install --no-cache-dir packages/shared-utils

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Run Postgres integration suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ekoa_test
          EKOA_FERNET_KEY: Pn7QkC3vX9yW4mT8sL5jH2bG6rA1dE0fV9zK8nM3qX0=
        run: pytest tests/test_phase9_integration.py -q --tb=short

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check + lint
        run: npm run lint && npx tsc --noEmit

      - name: Run frontend tests
        run: npm test

      - name: Build
        run: npm run build
